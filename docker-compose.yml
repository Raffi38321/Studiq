services:
  mongodb:
    container_name: "mongodb"
    image: mongo:8.0.4
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: raffi
      MONGO_INITDB_ROOT_PASSWORD: 877021
    volumes:
      - mongo_data:/data/db

  broker:
    image: apache/kafka:latest
    container_name: "kafka-broker"
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/29092'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKER: broker:29092
      MONGO_URL: mongodb://raffi:877021@mongodb:27017/studiq?authSource=admin
      PORT: 8080
    depends_on:
      broker:
        condition: service_healthy

  summary-consumer:
    build: ./summary-consumer
    environment:
      KAFKA_BROKER: broker:29092
      GEMINI_KEY: ${GEMINI_API}
      MONGO_URL: mongodb://raffi:877021@mongodb:27017/studiq?authSource=admin
    depends_on:
      broker:
        condition: service_healthy

  questions-consumer:
    build: ./questions-consumer
    environment:
      KAFKA_BROKER: broker:29092
      GEMINI_API: ${GEMINI_API}
      MONGO_URL: mongodb://raffi:877021@mongodb:27017/studiq?authSource=admin
    depends_on:
      - backend

  insight-consumer:
    build: ./insight-consumer
    environment:
      KAFKA_BROKER: broker:29092
      GEMINI_API: ${GEMINI_API}
      MONGO_URL: mongodb://raffi:877021@mongodb:27017/studiq?authSource=admin
    depends_on:
      - backend

volumes:
  kafka_data:
  mongo_data:
